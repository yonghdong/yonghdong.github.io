<style>
  .sq-anim { width: 100%; height: auto; display: block; cursor: pointer; }
  .sq-anim text { font-family: "Helvetica Neue", Arial, system-ui, sans-serif; fill: #111; }
  .sq-anim .sq-serif { font-family: "Times New Roman", Times, serif; }
  .sq-anim .sq-axis { font-size: 40px; }
  .sq-anim .sq-axis-sm { font-size: 32px; }
  .sq-anim .sq-axis-xs { font-size: 26px; }
  .sq-anim .sq-title { font-size: 64px; font-weight: 700; }
  .sq-anim .sq-sub-title { font-size: 33px; }
  .sq-anim .sq-tau { font-size: 34px; }
  .sq-anim .sq-node-a { font-size: 38px; }
  .sq-anim .sq-grad { font-size: 40px; }
  .sq-anim .sq-sub { font-size: 22px; }

  .sq-anim .sq-jac { font-size: 34px; }
  .sq-anim .sq-cost { font-size: 33px; font-weight: 700; }
  .sq-anim .sq-ink-stroke { stroke: #222; }
  .sq-anim .sq-ink-fill { fill: #222; }
  html[data-theme="dark"] .sq-anim .sq-axis,
  html[data-theme="dark"] .sq-anim .sq-axis-sm,
  html[data-theme="dark"] .sq-anim .sq-axis-xs { fill: #e6e6e6; }
  html[data-theme="dark"] .sq-anim .sq-ink-stroke { stroke: #e6e6e6; }
  html[data-theme="dark"] .sq-anim .sq-ink-fill { fill: #e6e6e6; }

  .sq-anim .sq-content { transition: opacity .5s ease; }
  .sq-anim .sq-content.sq-hidden { opacity: 0; }
  .sq-anim .sq-draw { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .sq-anim .sq-fade { opacity: 0; }
  .sq-anim.sq-play .sq-draw { animation: sq-draw var(--dur, 1s) ease-in-out var(--delay, 0s) forwards; }
  .sq-anim.sq-play .sq-fade { animation: sq-fade var(--dur, .4s) ease-out var(--delay, 0s) forwards; }
  @keyframes sq-draw { to { stroke-dashoffset: 0; } }
  @keyframes sq-fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .sq-anim .sq-draw { stroke-dashoffset: 0; }
    .sq-anim .sq-fade { opacity: 1; }
    .sq-anim * { animation: none !important; }
  }
</style>

<script>
  (function () {
    var svg = document.getElementById("sqam-main-anim");
    if (!svg) return;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || !("IntersectionObserver" in window)) {
      svg.classList.add("sq-play");
      if (reduce) return;
    }
    var content = svg.querySelector(".sq-content");
    var busy = false;
    function restart() {
      svg.classList.remove("sq-play");
      void svg.getBoundingClientRect();
      svg.classList.add("sq-play");
    }
    // Click: fade out, then play again from the start.
    function replay() {
      if (busy) return;
      busy = true;
      content.classList.add("sq-hidden");
      setTimeout(function () {
        restart();
        content.classList.remove("sq-hidden");
        busy = false;
      }, 450);
    }
    svg.addEventListener("click", replay);
    // Play once each time the figure enters the viewport, then hold the final frame.
    if ("IntersectionObserver" in window) {
      var inView = false;
      new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting && !inView) {
            inView = true;
            restart();
          } else if (!e.isIntersecting) {
            inView = false;
          }
        });
      }, { threshold: 0.35 }).observe(svg);
    }
  })();
</script>
